<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MiniTok Preview</title>
<meta name="description" content="Try MiniTok in your browser: real TikTok videos, ranked by an algorithm you control.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .stage { height: 100%; display: grid; place-items: center; }
  #feed { width: 100%; height: 100%; padding-top: env(safe-area-inset-top); }
  .back { display: none; position: fixed; top: 16px; left: 18px; color: #bbb; font: 14px -apple-system, "Segoe UI", Roboto, sans-serif; text-decoration: none; }
  .back:hover { color: #fff; }
  @media (min-width: 700px) and (min-height: 560px) {
    .stage { background: radial-gradient(ellipse at center, #1a0b10 0%, #000 70%); }
    #feed { width: min(420px, calc((100vh - 40px) * 9 / 16)); height: min(calc(100vh - 40px), 746px); padding-top: 0;
            border-radius: 34px; overflow: hidden; box-shadow: 0 0 0 10px #111, 0 0 0 11px #333, 0 30px 90px rgba(254,44,85,.2); }
    .back { display: block; }
  }
</style>
</head>
<body>
<a class="back" href="../">← MiniTok</a>
<div class="stage"><div id="feed"></div></div>
<!-- the MiniTok JS library: the same file anyone can load from the CDN (see ../js/README) -->
<script src="minitok.js"></script>
<script>
  fetch("videos.json")
    .then((r) => r.json())
    .then((d) => (window.feed = MiniTok.mount("#feed", { videos: d.videos })))
    .catch(() => (window.feed = MiniTok.mount("#feed")));
</script>
</body>
</html>
