[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minitok"
version = "0.1.0"
description = "A mini TikTok-style player with a feed algorithm you can edit and learn from your own data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "yt-dlp>=2024.1.1",
    "scrapy>=2.11",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
minitok = "minitok.__main__:main"

[tool.setuptools.packages.find]
include = ["minitok*"]

[tool.setuptools.package-data]
minitok = ["ui/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
